  return segs;
}

function leaf(ctx, x, y, ang, len, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.42, -len * 0.36, len, 0);
  ctx.quadraticCurveTo(len * 0.42, len * 0.36, 0, 0);
  ctx.fillStyle = withAlpha(color, alpha);
  ctx.fill();
  ctx.strokeStyle = withAlpha(LETTER, alpha * 0.85);
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(2, 0);
  ctx.lineTo(len * 0.82, 0);
  ctx.stroke();
  ctx.restore();
}

function drawBird(ctx, x, y, sc, flip, ink, grow) {
  if (grow < 0.05) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip * sc, sc);
  ctx.globalAlpha *= Math.min(1, grow);
  ctx.fillStyle = ink;
  ctx.strokeStyle = ink;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(-6, -1);
  ctx.quadraticCurveTo(-26, -14, -40, -6);
  ctx.moveTo(-6, 1);
  ctx.quadraticCurveTo(-28, 4, -42, 10);
  ctx.moveTo(-4, -3);
  ctx.quadraticCurveTo(-22, -18, -34, -16);
  ctx.stroke();
  const seed = Math.round(Math.abs(x) + Math.abs(y) * 0.3);
  const bodyRx = 14 + hash2(seed, 1) * 5;
  const bodyRy = 6 + hash2(seed, 2) * 2.4;
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyRx, bodyRy, -0.15 - hash2(seed, 3) * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-1, -2);
  ctx.quadraticCurveTo(-10, -18, 8, -7);
  ctx.quadraticCurveTo(2, -5, -1, -2);
  ctx.fill();
  ctx.lineWidth = 3.1;
  ctx.beginPath();
  ctx.moveTo(9, -2);
  ctx.quadraticCurveTo(18, -8, 26, -18);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(29, -20, 4.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(32, -20);
  ctx.lineTo(44, -17.6);
  ctx.lineTo(32, -16.6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = bright.amber;
  ctx.beginPath();
  ctx.arc(30.2, -21.1, 1.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = ink;
  ctx.beginPath();
  ctx.arc(30.5, -21.1, 0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.05;
  ctx.beginPath();
  ctx.moveTo(3, 6);
  ctx.lineTo(5, 16);
  ctx.moveTo(5, 16);
  ctx.lineTo(1, 19);
  ctx.moveTo(5, 16);
  ctx.lineTo(9, 18);
  ctx.moveTo(-3, 5);
  ctx.lineTo(-5, 15);
  ctx.lineTo(-9, 17);
  ctx.stroke();
  ctx.restore();
}

function arcStroke(ctx, cx, cy, r, grow, color, width) {
  if (grow <= 0.02) return;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, grow));
  ctx.stroke();
}

function polyStroke(ctx, cx, cy, r, n, rot, grow, color, width) {
  if (grow <= 0.02) return;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  const steps = Math.max(1, Math.ceil(n * Math.min(1, grow)));
  for (let i = 0; i <= steps; i++) {
    const a = rot + (i / n) * Math.PI * 2;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

/** Euclid: three concentric circles and one octagon. No vesica, no star. */
function construction(ctx, cx, cy, r, grow) {
  const g1 = smoothstep(0, 0.32, grow);
  const g2 = smoothstep(0.18, 0.5, grow);
  const g3 = smoothstep(0.34, 0.68, grow);
  const g4 = smoothstep(0.48, 0.9, grow);
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  arcStroke(ctx, cx, cy, r, g1, INK, 1.45);
  arcStroke(ctx, cx, cy, r * 0.68, g2, INK, 1.1);
  arcStroke(ctx, cx, cy, r * 0.36, g3, INK, 0.9);
  polyStroke(ctx, cx, cy, r * 0.84, 8, Math.PI / 8, g4, INK, 1.15);
  ctx.restore();
}

function woodcutLetter(ctx, ch, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.lineCap = "butt";
  ctx.lineJoin = "miter";
  ctx.strokeStyle = RUBRIC;
  const stroke = (w, pts) => {
    ctx.beginPath();
    ctx.lineWidth = s * w;
    ctx.moveTo(pts[0][0] * s, pts[0][1] * s);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * s, pts[i][1] * s);
    ctx.stroke();
  };
  const L = (ch || "I").toUpperCase();
  if (L === "I") {
    stroke(0.11, [[0.16, 0.06], [0.84, 0.06]]);
    stroke(0.2, [[0.5, 0.06], [0.5, 0.94]]);
    stroke(0.11, [[0.16, 0.94], [0.84, 0.94]]);
  } else if (L === "F") {
    stroke(0.18, [[0.26, 0.06], [0.26, 0.94]]);
    stroke(0.14, [[0.26, 0.1], [0.86, 0.1]]);
    stroke(0.14, [[0.26, 0.46], [0.74, 0.46]]);
  } else if (L === "T") {
    stroke(0.15, [[0.08, 0.1], [0.92, 0.1]]);
    stroke(0.18, [[0.5, 0.1], [0.5, 0.94]]);
  } else if (L === "A") {
    stroke(0.16, [[0.5, 0.06], [0.14, 0.94]]);
    stroke(0.16, [[0.5, 0.06], [0.86, 0.94]]);
    stroke(0.13, [[0.28, 0.58], [0.72, 0.58]]);
  } else if (L === "Y") {
    stroke(0.16, [[0.14, 0.06], [0.5, 0.46]]);
    stroke(0.16, [[0.86, 0.06], [0.5, 0.46]]);
    stroke(0.18, [[0.5, 0.46], [0.5, 0.94]]);
  } else {
    ctx.fillStyle = RUBRIC;
    ctx.font = bodyFont(Math.round(s * 0.9), 800);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(L, s * 0.5, s * 0.52);
  }
  ctx.restore();
}

function woodcutInitial(ctx, x, y, size, ch, grow, inkAlpha) {
  const g = Math.min(1, Math.max(0, grow));
  ctx.save();
  ctx.fillStyle = withAlpha(LETTER, 0.1);
  ctx.fillRect(x, y, size, size);
  ctx.strokeStyle = LETTER;
  ctx.lineWidth = 2.6;
  ctx.strokeRect(x, y, size, size);
  ctx.strokeStyle = bright.amber;
  ctx.lineWidth = 1.15;
  ctx.strokeRect(x + 7, y + 7, size - 14, size - 14);

  ctx.save();
  ctx.beginPath();
  ctx.rect(x + 12, y + 12, size - 24, size - 24);
  ctx.clip();
  ctx.strokeStyle = withAlpha(INK, 0.16);
  ctx.lineWidth = 0.7;
  const step = 14;
  for (let i = -size; i < size * 2; i += step) {
    ctx.beginPath();
    ctx.moveTo(x + i, y);
    ctx.lineTo(x + i + size, y + size);
    ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = LETTER;
  const b = 8;
  const pad = 16;
  for (const [cx, cy] of [
    [x + pad, y + pad],
    [x + size - pad - b, y + pad],
    [x + pad, y + size - pad - b],
    [x + size - pad - b, y + size - pad - b]
  ]) ctx.fillRect(cx, cy, b, b);

  if (g > 0.4) {
    leaf(ctx, x + 22, y + size - 22, -0.8, 16 * g, dark.emerald, 0.8);
    leaf(ctx, x + size - 22, y + 22, 2.2, 16 * g, dark.emerald, 0.8);
  }

  if (inkAlpha > 0.02) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x + 18, y + 18, size - 36, size - 36);
    ctx.clip();
    ctx.globalAlpha *= inkAlpha;
    woodcutLetter(ctx, ch, x + size * 0.16, y + size * 0.14, size * 0.68);
    ctx.restore();
  }
  ctx.restore();
}

function ruledBorder(ctx, w, h) {
  ctx.save();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.2;
  ctx.strokeRect(16, 14, w - 32, h - 28);
  ctx.lineWidth = 0.7;
  ctx.strokeRect(23, 21, w - 46, h - 42);
  ctx.fillStyle = LETTER;
  const corners = [[16, 14], [w - 26, 14], [16, h - 24], [w - 26, h - 24]];
  for (const [x, y] of corners) ctx.fillRect(x, y, 10, 10);
  ctx.restore();
}

function headpiece(ctx, w, grow) {
  const y = 46;
  const left = 48;
  const right = w - 48;
  const mid = w / 2;
  const band = 70;
  ctx.save();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.15;
  ctx.beginPath();
  ctx.moveTo(left, y);
  ctx.lineTo(right, y);
  ctx.moveTo(left, y + band);
  ctx.lineTo(right, y + band);
  ctx.stroke();

  const vineG = smoothstep(0.12, 0.7, grow);
  const amp = 10;
  const cy = y + band / 2;
  penRibbon(ctx, waveSegs(left + 70, mid - 78, cy, amp, 7), vineG, INK, 0.9, 0.72);
  penRibbon(ctx, waveSegs(mid + 78, right - 70, cy, amp, 7), vineG, INK, 0.9, 0.72);

  if (vineG > 0.35) {
    const spanL = (mid - 78 - (left + 70)) / 7;
    for (let i = 0; i < 7; i += 2) {
      const x = left + 70 + (i + 0.5) * spanL;
      leaf(ctx, x, cy - amp, -Math.PI / 2, 16, dark.emerald, vineG);
      const xr = mid + 78 + (i + 0.5) * spanL;
      leaf(ctx, xr, cy + amp, Math.PI / 2, 16, dark.emerald, vineG);
    }
  }

  construction(ctx, mid, cy, 30, smoothstep(0, 0.55, grow));
  drawBird(ctx, left + 36, cy + 6, 0.72, 1, LETTER, smoothstep(0.4, 0.85, grow));
  drawBird(ctx, right - 36, cy + 6, 0.72, -1, LETTER, smoothstep(0.45, 0.9, grow));
  ctx.restore();
}

function inkBlot(ctx, x, y, seed, scale, alpha) {
  const s = scale || 1;
  const a = alpha == null ? 0.88 : alpha;
  const lobes = 6 + Math.floor(hash2(seed, 1) * 5);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(hash2(seed, 2) * Math.PI * 2);
  ctx.beginPath();
  for (let i = 0; i <= lobes; i++) {
    const ang = (i / lobes) * Math.PI * 2;
    const rad = (0.42 + hash2(seed, 10 + i) * 0.85) * 9 * s;
    const px = Math.cos(ang) * rad;
    const py = Math.sin(ang) * rad * (0.62 + hash2(seed, 3) * 0.55);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = withAlpha(INK, a);
  ctx.fill();
  const drops = Math.floor(hash2(seed, 4) * 4);
  for (let i = 0; i < drops; i++) {
    const ang = hash2(seed, 20 + i) * Math.PI * 2;
    const dist = (9 + hash2(seed, 30 + i) * 11) * s;
    const r = (0.7 + hash2(seed, 40 + i) * 2.2) * s;
    ctx.beginPath();
    ctx.ellipse(
      Math.cos(ang) * dist,
      Math.sin(ang) * dist,
      r,
      r * (0.55 + hash2(seed, 50 + i) * 0.7),
      ang,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }
  ctx.restore();
}

function marginSwash(ctx, x, y, dir, grow, scale) {
  const sc = scale || 1;
  const seed = Math.round(Math.abs(x) * 0.13 + y * 0.07) + (dir < 0 ? 17 : 3);
  const len = (250 + hash2(seed, 4) * 90) * sc;
  const lean = (hash2(seed, 5) - 0.5) * 16 * dir * sc;
  const bow = (hash2(seed, 6) - 0.5) * 10 * sc;
  const y1 = y + len;
  penRibbon(
    ctx,
    [cubic(
      pt(x, y),
      pt(x + bow, y + len * 0.34),
      pt(x + lean * 0.45, y + len * 0.68),
      pt(x + lean, y1)
    )],
    grow,
    INK,
    0.96,
    (0.62 + hash2(seed, 7) * 0.35) * sc
  );
  if (grow > 0.66) inkBlot(ctx, x + lean, y1, seed + 9, (0.55 + hash2(seed, 8) * 0.65) * sc, 0.9);
}

function gutterRule(ctx, x, y0, y1, grow) {
  const y = y0 + (y1 - y0) * Math.min(1, Math.max(0, grow));
  ctx.save();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(x, y0);
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.restore();
}

function pageTurn(ctx, w, h, turn) {
  if (turn <= 0.004) return;
  const edge = w - 22 - turn * w * 0.9;
  const bow = 36 + turn * 24;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(edge, 18);
  ctx.bezierCurveTo(edge + bow, h * 0.26, edge + bow * 0.45, h * 0.74, edge + 4, h - 18);
  ctx.lineTo(w - 12, h - 18);
  ctx.lineTo(w - 12, 18);
  ctx.closePath();
  ctx.fillStyle = parchment;
  ctx.fill();
  ctx.save();
  ctx.clip();
  const shade = ctx.createLinearGradient(edge, 0, edge + 110, 0);
  shade.addColorStop(0, dark.amber);
  shade.addColorStop(0.07, dark.topaz);
  shade.addColorStop(0.2, parchment);
  shade.addColorStop(1, parchment);
  ctx.fillStyle = shade;
  ctx.fillRect(edge - 8, 0, w, h);
  for (let i = 0; i < 70; i++) {
    const fx = edge + 12 + hash2(i, 11) * Math.max(8, w - edge - 24);
    const fy = 28 + hash2(i, 12) * (h - 56);
    ctx.strokeStyle = withAlpha(INK, 0.045 + hash2(i, 13) * 0.07);
    ctx.lineWidth = 0.45;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + (hash2(i, 14) - 0.5) * 22, fy + 3 + hash2(i, 15) * 12);
    ctx.stroke();
  }
  for (let i = 0; i < 9; i++) {
    inkBlot(
      ctx,
      edge + 24 + hash2(i, 21) * Math.max(8, w - edge - 48),
      40 + hash2(i, 22) * (h - 80),
      80 + i,
      0.22 + hash2(i, 23) * 0.38,
      0.1 + hash2(i, 24) * 0.1
    );
  }
  ctx.restore();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.15;
  ctx.beginPath();
  ctx.moveTo(edge, 18);
  ctx.bezierCurveTo(edge + bow, h * 0.26, edge + bow * 0.45, h * 0.74, edge + 4, h - 18);
  ctx.stroke();
  ctx.restore();
}

function signatureOf(i) {
  const letter = String.fromCharCode(65 + (Math.floor(i / 3) % 8));
  const n = (i % 3) + 1;
  return n === 1 ? letter : `${letter}${n}`;
}

function measureWrap(ctx, words, maxW, font) {
  ctx.font = font;
  const space = ctx.measureText(" ").width;
  const lines = [];
  let cur = [];
  let width = 0;
  for (const word of words) {
    const ww = ctx.measureText(word).width;
    const add = cur.length ? space + ww : ww;
    if (cur.length && width + add > maxW) {
      lines.push({ words: cur, width });
      cur = [word];
      width = ww;
    } else {
      cur.push(word);
      width += add;
    }
  }
  if (cur.length) lines.push({ words: cur, width });
  return { lines, space };
}

function lineModel(ctx, words, font, maxW, justify) {
  ctx.font = font;
  const space = ctx.measureText(" ").width;
  const pieces = words.map((text) => ({ text, width: ctx.measureText(text).width }));
  const textW = pieces.reduce((a, p) => a + p.width, 0);
  const gaps = Math.max(0, pieces.length - 1);
  const natural = textW + space * gaps;
  const extra = maxW - natural;
  const canJustify = justify && gaps > 0 && extra > 0 && extra < space * gaps * 2.4;
  const gap = canJustify ? space + extra / gaps : space;
  return { pieces, gap, width: canJustify ? maxW : natural };
}

function inkOfLine(i, n, settle) {
  const start = (i / Math.max(1, n)) * 0.72;
  return smoothstep(start, Math.min(1, start + 0.3), settle);
}

class Scene4 {
  constructor(ctx) {
    this.ctx = ctx;
    this.t = 0;
    this.last = 0;
    this.data = null;
    this.fontEpoch = 0;
    this.cache = null;
    this.cacheKey = "";
    if (typeof document !== "undefined" && document.fonts) {
      document.fonts.addEventListener("loadingdone", () => {
        this.fontEpoch++;
        this.cache = null;
      });
    }
    this.load();
  }

  async load() {
    try {
      if (typeof document !== "undefined" && document.fonts) await document.fonts.ready;
      const r = await fetch("/kjv1611.json");
      this.data = await r.json();
    } catch {
      this.data = { passages: [] };
    }
    this.fontEpoch++;
    this.cache = null;
  }

  render(params, w, h) {
    const now = performance.now();
    const dt = this.last ? Math.min(0.05, (now - this.last) / 1000) : 0.016;
    this.last = now;
    this.t += dt * (0.42 + (params.motion ?? 0.32) * 1.2);

    const ctx = this.ctx;
    ctx.save();
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.textBaseline = "alphabetic";

    this.ground(ctx, w, h, params.microtexture ?? 0.55);
    ruledBorder(ctx, w, h);

    const passages = this.data?.passages || [];
    if (!passages.length) {
      ctx.fillStyle = INK;
      ctx.font = bodyFont(22);
      ctx.textAlign = "left";
      ctx.fillText("Loading the 1611 text…", 80, h * 0.5);
      ctx.restore();
      return;
    }

    const idx = Math.floor(this.t / PAGE) % passages.length;
    const local = (this.t / PAGE) - Math.floor(this.t / PAGE);
    const grow = smoothstep(0, 0.4, local);
    const settle = smoothstep(0.06, 0.48, local);
    const turn = smoothstep(0.9, 1, local);
    const passage = passages[idx];
    const next = passages[(idx + 1) % passages.length];

    headpiece(ctx, w, grow);
    const layout = this.layoutFor(passage, w, h);
    this.drawFurniture(ctx, layout, w, settle, idx);
    this.drawBody(ctx, layout, settle);
    this.drawMargins(ctx, layout, grow, w, h);
    this.drawFooter(ctx, layout, next, idx, w, h, settle, grow);
    pageTurn(ctx, w, h, turn);
    ctx.restore();
  }

  ground(ctx, w, h, micro) {
    ctx.fillStyle = parchment;
    ctx.fillRect(0, 0, w, h);
    const fibers = 110;
    for (let i = 0; i < fibers; i++) {
      const x = hash2(i, 2) * w;
      const y = hash2(i, 6) * h;
      const len = 6 + hash2(i, 8) * 18;
      const ang = (hash2(i, 9) - 0.5) * 0.8;
      ctx.strokeStyle = withAlpha(INK, (0.035 + hash2(i, 4) * 0.06) * (0.45 + micro));
      ctx.lineWidth = 0.35 + hash2(i, 5) * 0.45;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      ctx.stroke();
    }
    for (let i = 0; i < 16; i++) {
      inkBlot(
        ctx,
        hash2(i, 31) * w,
        hash2(i, 32) * h,
        200 + i * 13,
        0.18 + hash2(i, 33) * 0.45,
        (0.06 + hash2(i, 34) * 0.08) * (0.5 + micro)
      );
    }
  }

  placeNotes(ctx, verses, w, textTop, textBot) {
    const font = handFont(22);
    const notes = [];
    let leftY = textTop;
    let rightY = textTop;
    for (const v of verses) {
      if (!v.note) continue;
      const right = v.col === 1;
      const x = right ? w - 206 : 30;
      const wrap = right ? 168 : 186;
      const lines = measureWrap(ctx, wordsOf(v.note), wrap, font).lines.map((l) => l.words.join(" "));
      if (!lines.length) continue;
      const y = Math.max(v.y || textTop, right ? rightY : leftY);
      if (y > textBot - 40) continue;
      notes.push({
        x,
        y,
        marker: String(v.n),
        lines
      });
      const next = y + 26 + lines.length * 26 + 14;
      if (right) rightY = next;
      else leftY = next;
    }
    return notes;
  }

  layoutFor(passage, w, h) {
    const key = `${passage.id}|${w}|${h}|${this.fontEpoch}`;
    if (this.cache && this.cacheKey === key) return this.cache;
    const chars = (passage.verses || []).reduce((n, v) => n + v.text.length, 0);
    const layout = chars < 280 ? this.layoutPlate(passage, w, h) : this.layoutPage(passage, w, h);
    this.cache = layout;
    this.cacheKey = key;
    return layout;
  }

  layoutPage(passage, w, h) {
    const ctx = this.ctx;
    const title = passage.running || passage.book;
    let bookPx = 42;
    let bookFont = headingFont(bookPx);
    ctx.font = bookFont;
    while (bookPx > 28 && ctx.measureText(passage.book).width > w - 180) {
      bookPx -= 2;
      bookFont = headingFont(bookPx);
      ctx.font = bookFont;
    }
    const book = passage.book;
    const argFont = bodyFont(24, 400);
    const argLineH = 32;
    const argLines = measureWrap(ctx, wordsOf(passage.head || ""), 1080, argFont).lines;
    const titleY = 198;
    const bookY = 286;
    const chapterY = 360;
    const argY = chapterY + 48;
    const textTop = argY + argLines.length * argLineH + 24;
    const textBot = h - 78;
    const colW = 690;
    const cols = [
      { x: 240, w: colW },
      { x: 980, w: colW }
    ];
    const initial = {
      x: cols[0].x,
      y: textTop,
      size: 148,
      ch: ((passage.verses[0]?.text || "I")[0] || "I").toUpperCase()
    };

function bedPost(t, rot) {
  const rings = [
    [0.04, 0.025, 0.15],
    [0.16, 0.05, 0.24],
    [0.28, 0.022, 0.1],
    [0.40, 0.055, 0.2],
    [0.52, 0.02, 0.08],
    [0.64, 0.04, 0.14],
    [0.78, 0.03, 0.11],
    [0.92, 0.035, 0.16]
  ];
  let r = 0.08;
  for (const [c, w, a] of rings) r += a * gauss(t, c, w);
  r += gauss(t, 0.16, 0.05) * 0.028 * Math.cos(8 * rot + 0.4);
  return r;
}

/** Table baluster: foot, slim ankle, vase, ring under the apron. */
function baluster(t, rot) {
  const rings = [
    [0.06, 0.04, 0.2],
    [0.22, 0.06, 0.08],
    [0.48, 0.1, 0.26],
    [0.7, 0.04, 0.1],
    [0.88, 0.06, 0.18]
  ];
  let r = 0.07;
  for (const [c, w, a] of rings) r += a * gauss(t, c, w);
  r += gauss(t, 0.48, 0.1) * 0.03 * Math.cos(8 * rot);
  return r;
}

function drawCover(ctx, img, x, y, w, h) {
  const ia = img.width / img.height;
  const ba = w / Math.max(1, h);
  let dw;
  let dh;
  let dx;
  let dy;
  if (ia > ba) {
    dh = h;
    dw = h * ia;
    dx = x - (dw - w) / 2;
    dy = y;
  } else {
    dw = w;
    dh = w / ia;
    dx = x;
    dy = y - (dh - h) / 2;
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}

function putImage(ctx, img, a, b, c, d, e, f) {
  ctx.save();
  ctx.setTransform(a, b, c, d, e, f);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

function drawWallY(ctx, ox, oy, x0, x1, y, z0, z1, img) {
  const dx = x1 - x0;
  const dz = z1 - z0;
  putImage(
    ctx, img,
    (dx * COS) / img.width,
    (dx * SIN) / img.width,
    0,
    dz / img.height,
    ox + (x0 - y) * COS,
    oy + (x0 + y) * SIN - z1
  );
}

function drawWallX(ctx, ox, oy, x, y0, y1, z0, z1, img) {
  const dy = y1 - y0;
  const dz = z1 - z0;
  putImage(
    ctx, img,
    -(dy * COS) / img.width,
    (dy * SIN) / img.width,
    0,
    dz / img.height,
    ox + (x - y0) * COS,
    oy + (x + y0) * SIN - z1
  );
}

function drawFloor(ctx, ox, oy, x0, y0, x1, y1, z, img) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  putImage(
    ctx, img,
    (dx * COS) / img.width,
    (dx * SIN) / img.width,
    -(dy * COS) / img.height,
    (dy * SIN) / img.height,
    ox + (x0 - y0) * COS,
    oy + (x0 + y0) * SIN - z
  );
}

function tileCount(span, img, edge) {
  const want = edge * (img.width / img.height);
  const n = Math.max(1, Math.round(span / Math.max(8, want)));
  return { n, step: span / n };
}

function strokeWallY(ctx, ox, oy, x0, x1, y, z0, z1) {
  ctx.beginPath();
  const a = isoAt(ox, oy, x0, y, z1);
  const b = isoAt(ox, oy, x1, y, z1);
  const c = isoAt(ox, oy, x1, y, z0);
  const d = isoAt(ox, oy, x0, y, z0);
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.lineTo(c.x, c.y);
  ctx.lineTo(d.x, d.y);
  ctx.closePath();
  ctx.stroke();
}

function strokeWallX(ctx, ox, oy, x, y0, y1, z0, z1) {
  ctx.beginPath();
  const a = isoAt(ox, oy, x, y0, z1);
  const b = isoAt(ox, oy, x, y1, z1);
  const c = isoAt(ox, oy, x, y1, z0);
  const d = isoAt(ox, oy, x, y0, z0);
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.lineTo(c.x, c.y);
  ctx.lineTo(d.x, d.y);
  ctx.closePath();
  ctx.stroke();
}

function drawTurning(ctx, ox, oy, x, y, z0, z1, profile, rot, girth, w, h) {
  const steps = 28;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const z = z0 + (z1 - z0) * t;
    const radius = Math.max(3.5, profile(t, rot) * girth);
    const c = isoAt(ox, oy, x, y, z);
    if (inWell(c.x, c.y, w, h, 0)) continue;
    const rx = radius * 1.05;
    const ry = Math.max(2.4, radius * 0.48);
    ctx.fillStyle = i % 2 === 0 ? bright.sardius : dark.amber;
    ctx.beginPath();
    ctx.ellipse(c.x - 1, c.y - 0.6, rx * 0.9, ry * 0.86, -0.42, 0, Math.PI * 2);
    ctx.fill();
    if (i % 3 === 0) {
      ctx.strokeStyle = bright.amber;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.strokeStyle = withAlpha(bright.ligure, 0.95);
    ctx.lineWidth = Math.max(1.2, radius * 0.08);
    const a0 = rot + t * 5;
    ctx.beginPath();
    ctx.ellipse(c.x - 1, c.y - 0.6, rx * 0.62, ry * 0.62, -0.42, a0, a0 + 1.05);
    ctx.stroke();
  }
}

function drawGouge(ctx, ox, oy, x, y, z0, z1, profile, girth, t, w, h) {
  const z = z0 + (z1 - z0) * t;
  const radius = profile(t, 0) * girth;
  const c = isoAt(ox, oy, x, y, z);
  const edgeX = c.x + radius * 0.92;
  const edgeY = c.y;
  if (inWell(edgeX, edgeY, w, h, 4)) return;
  const s = Math.max(1, girth / 36);
  ctx.fillStyle = bright.topaz;
  ctx.beginPath();
  ctx.moveTo(edgeX - 2 * s, edgeY - 6 * s);
  ctx.lineTo(edgeX + 13 * s, edgeY);
  ctx.lineTo(edgeX - 2 * s, edgeY + 6 * s);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = dark.amber;
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.strokeStyle = bright.pearl;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(edgeX - 8 * s, edgeY - 10 * s, 8 * s, 0.15, 2.5);
  ctx.stroke();
  ctx.strokeStyle = withAlpha(bright.ligure, 0.85);
  ctx.beginPath();
  ctx.arc(edgeX - 14 * s, edgeY - 16 * s, 5 * s, 0.4, 2.6);
  ctx.stroke();
}

/** Three concentric circles and one octagon. No star, no vesica. */
function circlesAndOctagon(ctx, x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = bright.amber;
  ctx.lineWidth = 1.5;
  for (const k of [1, 0.7, 0.42]) {
    ctx.beginPath();
    ctx.ellipse(0, 0, r * k, r * k * 0.62, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.strokeStyle = bright.topaz;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 - Math.PI / 8;
    const px = Math.cos(a) * r * 0.78;
    const py = Math.sin(a) * r * 0.48;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

/**
 * One bar of a measure, fast enough to read without an OSC cue.
 * Idle: reverence, branle, and a small galliard hop, with a short travel.
 * Live: a wider pavane and a higher hop.
 */
function measureOf(t, idle) {
  const bar = ((t % 8) + 8) % 8;
  let bow = 0;
  let step = 0;
  let hop = 0;
  let arm = 0.15;
  const reach = idle ? 16 : 22;
  if (bar < 1.15) {
    bow = Math.sin((bar / 1.15) * Math.PI) * (idle ? 0.7 : 0.95);
    arm = -0.35;
  } else if (bar < 3.1) {
    const k = (bar - 1.15) / 1.95;
    step = Math.sin(k * Math.PI) * reach;
    arm = 0.25 + Math.sin(k * Math.PI) * 0.45;
  } else if (bar < 5.15) {
    const k = (bar - 3.1) / 2.05;
    step = -Math.sin(k * Math.PI) * reach;
    arm = 0.25 + Math.sin(k * Math.PI) * 0.45;
  } else if (bar < 7) {
    const k = (bar - 5.15) / 1.85;
    step = Math.sin(k * Math.PI * 2) * (idle ? 7 : 10);
    arm = 0.4;
  } else {
    hop = Math.sin(((bar - 7) / 1) * Math.PI) * (idle ? 7 : 11);
    arm = 0.85;
  }
  return { bow, step, hop, arm };
}

function block(ctx, x, y, w, h, fill, ink) {
  const X = Math.round(x);
  const Y = Math.round(y);
  ctx.fillStyle = ink;
  ctx.fillRect(X - 1, Y - 1, w + 2, h + 2);
  ctx.fillStyle = fill;
  ctx.fillRect(X, Y, w, h);
}

class Scene5 {
  constructor(ctx) {
    this.ctx = ctx;
    this.time = 0;
    this.wellFill = dark.vermilion;
    this.plates = null;
    this.shell = null;
    this.loadPlates();
  }

  loadPlates() {
    Promise.all(PLATES.map((spec) => loadImage(spec.src).then((img) => ({ spec, img }))))
      .then((loaded) => {
        const plates = {};
        for (const { spec, img } of loaded) {
          plates[spec.name] = remapPlate(img, !!spec.knock);
        }
        this.plates = plates;
        this.shell = null;
        if (plates.damask) this.wellFill = sampleWell(plates.damask);
      })
      .catch(() => {
        this.plates = null;
      });
  }

  render(params, w, h) {
    const motion = params.motion ?? 0.32;
    this.time += 0.016 * (0.42 + motion);
    const live = performance.now() - (params.oscAt || 0) < 2800;
    const rot = this.time * (0.42 + motion * 0.85);
    const gouge = (this.time * (0.18 + motion * 0.22)) % 1;
    const cam = isoRoom(w, h);
    const ctx = this.ctx;

    ctx.save();
    try {
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      if (this.plates) {
        this.blitShell(cam, w, h);
        this.clipWell(w, h);
        this.bed(cam, w, h, rot, gouge, "turn");
        this.cupboard(cam, w, h, rot, (gouge + 0.33) % 1, "turn");
        this.table(cam, w, h, rot, (gouge + 0.66) % 1, "turn");
      } else {
        this.clipWell(w, h);
        this.fallback(cam, w, h);
        this.furniture(cam, w, h, rot, gouge);
      }
      this.dancers(cam, w, h, motion, live);
    } finally {
      ctx.restore();
    }
  }

  /**
   * Walls, floor, ceiling and the still furniture faces do not move.
   * Paint them once. Each frame only the turned members, gouges and
   * dancers are redrawn, or the preview stalls under the plate count.
   */
  blitShell(cam, w, h) {
    if (!(this.shell && this.shellW === w && this.shellH === h)) {
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      const g = c.getContext("2d", { alpha: false });
      const prev = this.ctx;
      this.ctx = g;
      g.save();
      try {
        this.clipWell(w, h);
        g.lineJoin = "round";
        g.lineCap = "round";
        this.chamber(cam, w, h);
        this.bed(cam, w, h, 0, 0, "shell");
        this.cupboard(cam, w, h, 0, 0, "shell");
      } finally {
        g.restore();
        this.ctx = prev;
      }
      this.shell = c;
      this.shellW = w;
      this.shellH = h;
    }
    this.ctx.drawImage(this.shell, 0, 0);
  }

  clipWell(w, h) {
    const ctx = this.ctx;
    const r = wellRect(w, h);
    ctx.beginPath();
    ctx.rect(0, 0, w, h);
    const x = r.x;
    const y = r.y;
    const rw = r.w;
    const rh = r.h;
    const cr = r.r;
    ctx.moveTo(x + cr, y);
    ctx.arcTo(x + rw, y, x + rw, y + rh, cr);
    ctx.arcTo(x + rw, y + rh, x, y + rh, cr);
    ctx.arcTo(x, y + rh, x, y, cr);
    ctx.arcTo(x, y, x + rw, y, cr);
    ctx.closePath();
    ctx.clip("evenodd");
  }

  plate(name) {
    return this.plates[name] || this.plates.damask;
  }

  /** Full-frame abutment of the plates, then the iso shell over it. */
  chamber(cam, w, h) {
    const ctx = this.ctx;
    const { ox, oy, room, wallH } = cam;
    const damask = ctx.createPattern(this.plate("damask"), "repeat");
    ctx.fillStyle = damask || dark.vermilion;
    ctx.fillRect(0, 0, w, h);

    const coffer = room / 4;
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 4; j++) {
        const key = (i + j) % 2 === 0 ? "friezeA" : "friezeB";
        drawFloor(ctx, ox, oy, i * coffer, j * coffer, (i + 1) * coffer, (j + 1) * coffer, wallH, this.plate(key));
      }
    }
    isoBeams(ctx, cam, withAlpha(bright.amber, 0.55));

    this.wallY(cam, 0);
    this.wallX(cam, 0);
    this.floor(cam);
    this.cornice(w);
  }

  /** Full-width carved frieze so the top edge is plate, not empty ground. */
  cornice(w) {
    const ctx = this.ctx;
    const band = 92;
    const half = w / 2;
    drawCover(ctx, this.plate("friezeA"), 0, 0, half + 1, band);
    drawCover(ctx, this.plate("friezeB"), half - 1, 0, half + 1, band);
    ctx.strokeStyle = bright.amber;
    ctx.lineWidth = 2;
    ctx.strokeRect(3, 3, w - 6, band - 6);
  }

  wallY(cam, y) {
    const ctx = this.ctx;
    const { ox, oy, room, wallH } = cam;
    const bands = [
      { z0: 0, z1: 118, key: "strap" },
      { z0: 118, z1: 318, key: "plant" },
      { z0: 318, z1: 404, key: "friezeA" },
      { z0: 404, z1: wallH, key: "arcade" }
    ];
    ctx.strokeStyle = bright.amber;
    ctx.lineWidth = 1.6;
    for (const band of bands) {
      const img0 = this.plate(band.key);
      const { n, step } = tileCount(room, img0, band.z1 - band.z0);
      for (let i = 0; i < n; i++) {
        const alt = band.key === "plant" && i % 2 === 1;
        const frieze = band.key === "friezeA" && i % 2 === 1;
        const img = alt ? this.plate("cupboard") : frieze ? this.plate("friezeB") : img0;
        const x0 = i * step;
        const x1 = (i + 1) * step;
        drawWallY(ctx, ox, oy, x0, x1, y, band.z0, band.z1, img);
        strokeWallY(ctx, ox, oy, x0, x1, y, band.z0, band.z1);
      }
    }
  }

  wallX(cam, x) {
    const ctx = this.ctx;
    const { ox, oy, room, wallH } = cam;
    const bands = [
      { z0: 0, z1: 118, key: "strap" },
      { z0: 118, z1: 318, key: "cupboard" },
      { z0: 318, z1: 404, key: "friezeB" },
      { z0: 404, z1: wallH, key: "arcade" }
    ];
    ctx.strokeStyle = bright.ligure;
    ctx.lineWidth = 1.6;
    for (const band of bands) {
      const img0 = this.plate(band.key);
      const { n, step } = tileCount(room, img0, band.z1 - band.z0);
      for (let i = 0; i < n; i++) {
        const alt = band.key === "cupboard" && i % 2 === 1;
        const img = alt ? this.plate("plant") : img0;
        const y0 = i * step;
        const y1 = (i + 1) * step;
        drawWallX(ctx, ox, oy, x, y0, y1, band.z0, band.z1, img);
        strokeWallX(ctx, ox, oy, x, y0, y1, band.z0, band.z1);
      }
    }
  }

  floor(cam) {
    const ctx = this.ctx;
    const { ox, oy, room } = cam;
    const n = 4;
    const step = room / n;
    ctx.strokeStyle = withAlpha(bright.amber, 0.85);
    ctx.lineWidth = 1.4;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const key = (i + j) % 2 === 0 ? "damask" : "strap";
        const x0 = i * step;
        const y0 = j * step;
        drawFloor(ctx, ox, oy, x0, y0, x0 + step, y0 + step, 0, this.plate(key));
        ctx.beginPath();
        const a = isoAt(ox, oy, x0, y0, 0);
        const b = isoAt(ox, oy, x0 + step, y0, 0);
        const c = isoAt(ox, oy, x0 + step, y0 + step, 0);
        const d = isoAt(ox, oy, x0, y0 + step, 0);
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineTo(c.x, c.y);
        ctx.lineTo(d.x, d.y);
        ctx.closePath();
        ctx.stroke();
      }
    }
  }

  furniture(cam, w, h, rot, gouge) {
    this.bed(cam, w, h, rot, gouge);
    this.cupboard(cam, w, h, rot, (gouge + 0.33) % 1);
    this.table(cam, w, h, rot, (gouge + 0.66) % 1);
  }

  bed(cam, w, h, rot, gouge, part = "all") {
    const ctx = this.ctx;
    const { ox, oy } = cam;
    const x = 22;
    const y = 620;
    const dx = 108;
    const dy = 360;
    const posts = [
      [x, y],
      [x + dx, y],
      [x, y + dy],
      [x + dx, y + dy]
    ];
    if (part !== "turn" && this.plates) {
      isoBox(ctx, ox, oy, x + 8, y + 16, 52, dx - 16, dy - 28, 26,
        withAlpha(dark.crimson, 0.2),
        withAlpha(dark.vermilion, 0.35),
        withAlpha(dark.amber, 0.3),
        bright.amber);
      drawFloor(ctx, ox, oy, x + 8, y + 16, x + dx - 8, y + dy - 12, 78, this.plate("damask"));
      drawWallY(ctx, ox, oy, x, x + dx, y, 78, 300, this.plate("crest"));
      drawFloor(ctx, ox, oy, x - 6, y - 4, x + dx + 6, y + dy + 4, 328, this.plate("damask"));
      isoBox(ctx, ox, oy, x - 6, y - 4, 312, dx + 12, dy + 8, 18,
        withAlpha(dark.amber, 0.25),
        withAlpha(dark.vermilion, 0.45),
        withAlpha(dark.sardius, 0.4),
        bright.ligure);
    }
    if (part === "shell") return;
    posts.forEach((p, i) => {
      drawTurning(ctx, ox, oy, p[0], p[1], 0, 324, bedPost, rot * (i % 2 ? 1 : -1) + i, 72, w, h);
    });
    drawGouge(ctx, ox, oy, posts[1][0], posts[1][1], 0, 324, bedPost, 72, gouge, w, h);
  }

  cupboard(cam, w, h, rot, gouge, part = "all") {
    const ctx = this.ctx;
    const { ox, oy } = cam;
    const x = 760;
    const y = 70;
    const dx = 210;
    const dy = 140;
    if (part !== "turn" && this.plates) {
      isoBox(ctx, ox, oy, x + 16, y + 10, 18, dx - 28, dy - 18, 112,
        withAlpha(dark.amber, 0.3),
        withAlpha(dark.vermilion, 0.55),
        withAlpha(dark.sardius, 0.45),
        bright.amber);
      drawWallY(ctx, ox, oy, x + 18, x + dx - 14, y + dy - 8, 24, 124, this.plate("friezeA"));
      drawWallX(ctx, ox, oy, x + dx - 14, y + 12, y + dy - 8, 24, 124, this.plate("plant"));
      isoBox(ctx, ox, oy, x + 16, y + 10, 168, dx - 28, dy - 18, 96,
        withAlpha(dark.vermilion, 0.35),
        withAlpha(dark.amber, 0.5),
        withAlpha(dark.crimson, 0.4),
        bright.ligure);
      drawWallY(ctx, ox, oy, x + 18, x + dx - 14, y + dy - 8, 174, 258, this.plate("friezeB"));
      drawWallX(ctx, ox, oy, x + dx - 14, y + 12, y + dy - 8, 174, 258, this.plate("cupboard"));
      drawFloor(ctx, ox, oy, x + 8, y + 6, x + dx - 6, y + dy - 4, 276, this.plate("arcade"));
    }
    if (part === "shell") return;
    const posts = [
      [x, y],
      [x + dx, y],
      [x, y + dy],
      [x + dx, y + dy]
    ];
    posts.forEach((p, i) => {
      drawTurning(ctx, ox, oy, p[0], p[1], 0, 286, cupAndCover, -rot * (i % 2 ? 1 : -1) + i * 0.7, 86, w, h);
    });
    drawGouge(ctx, ox, oy, posts[2][0], posts[2][1], 0, 286, cupAndCover, 86, gouge, w, h);
  }

  table(cam, w, h, rot, gouge, part = "all") {
    if (part === "shell") return;
    const ctx = this.ctx;
    const { ox, oy } = cam;
    const x = 470;
    const y = 500;
    const dx = 230;
    const dy = 150;
    const legs = [
      [x, y],
      [x + dx, y],
      [x, y + dy],
      [x + dx, y + dy]
    ];
    legs.forEach((p, i) => {
      drawTurning(ctx, ox, oy, p[0], p[1], 0, 112, baluster, rot * (i % 2 ? -1 : 1) + i, 58, w, h);
    });
    if (this.plates) {
      isoBox(ctx, ox, oy, x - 16, y - 12, 112, dx + 32, dy + 24, 18,
        withAlpha(dark.amber, 0.35),
        withAlpha(dark.vermilion, 0.62),
        withAlpha(dark.topaz, 0.5),
        bright.amber);
      drawFloor(ctx, ox, oy, x - 16, y - 12, x + dx + 16, y + dy + 12, 130, this.plate("strap"));
      drawWallY(ctx, ox, oy, x - 14, x + dx + 14, y + dy + 10, 112, 130, this.plate("friezeB"));
      drawWallX(ctx, ox, oy, x + dx + 14, y - 10, y + dy + 10, 112, 130, this.plate("friezeA"));
